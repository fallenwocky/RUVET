<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>RUVET.</title>
<meta name="description" content="RUVET. — a prompt pipeline for anime and illustration image models">
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RUVET.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono&display=swap">
<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="studio">
<!-- app:start -->
<div id="app">
  <header class="bar">
    <button id="menuBtn" class="icon" aria-label="History"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1><svg class="gem" viewBox="0 0 24 24"><path d="M7 3h10l5 6-10 12L2 9z"/><path d="M2 9h20M7 3l5 6 5-6M12 9v12"/></svg>RUVET.</h1>
    <nav id="views" class="seg" aria-label="View"></nav>
    <button id="newBtn" class="icon" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="setBtn" class="icon" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>

  <main id="thread" aria-live="polite"></main>
  <section id="library" class="page" hidden></section>
  <section id="kit" class="page" hidden></section>
  <section id="memory" class="page" hidden></section>
  <section id="test" class="page" hidden></section>

  <footer id="composer">
    <div id="sparks" hidden></div>
    <div id="modes" class="chips" aria-label="Mode"></div>
    <button id="optsBtn" class="optsum" aria-expanded="false" aria-controls="opts"><span id="optsText"></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div id="opts" hidden>
      <div><div class="lbl">Target models — pick several to compile one idea for each</div><div id="targets" class="chips wrap"></div></div>
      <div class="fields">
        <label class="field">Rating<select id="rating"><option>general</option><option>sensitive</option><option>nsfw</option><option>explicit</option></select></label>
        <label class="field">Aspect<select id="aspect"><option value="">auto</option><option value="portrait">portrait</option><option value="landscape">landscape</option><option value="square">square</option></select></label>
        <label class="field" id="variantsWrap">Variant count<select id="variants"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
        <label class="field">Lens<select id="lens"></select></label>
        <label class="field">Tension<select id="tension"></select></label>
        <label class="field">Boldness<select id="bold"><option value="safe">safe</option><option value="balanced">balanced</option><option value="bold">bold</option></select></label>
      </div>
      <div><div class="lbl">From your kit — characters and LoRAs for this request</div><div id="cast" class="chips wrap"></div></div>
      <div id="toggles" class="chips wrap"></div>
    </div>
    <div id="attach" hidden><img alt="Attached image"><button id="attachDel" class="icon" aria-label="Remove image"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="inputrow">
      <label id="imgBtn" class="icon" for="file" role="button" tabindex="0" aria-label="Attach image"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg></label>
      <button id="sparkBtn" class="icon" aria-label="Spark ideas" title="Spark ideas"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/></svg></button>
      <textarea id="input" rows="1" placeholder="Type an idea, a prompt or a problem…"></textarea>
      <button id="sendBtn" class="send" aria-label="Send"><svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
    </div>
    <input id="file" class="file-input" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
    <input id="reviewFile" class="file-input" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
    <input id="restoreFile" class="file-input" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true">
  </footer>
</div>

<div id="scrim" hidden></div>
<aside id="drawer" aria-label="Chat history"><h2>History</h2><ul id="chats"></ul></aside>

<dialog id="settings">
  <form id="setForm">
    <h2>Settings</h2>
    <div id="setFields"></div>
    <div class="row">
      <button id="wipeBtn" type="button" class="btn danger">Delete all data</button>
      <button id="saveBtn" class="btn primary">Save</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>
<!-- app:end -->
<script src="app.js"></script>
<script type="module" src="backend-api.js"></script>
</body>
</html>
