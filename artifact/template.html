<title>RUVET.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono&display=swap">
<style>
/* Layout: one-screen chat tool — header band, scrolling thread, composer band pinned at the bottom. */
:root {
  --bg: #f3f5fb; --panel: #ffffff; --panel2: #e8ecf7; --line: #cdd5ea; --text: #131a2e; --dim: #57638a;
  --accent: #2a63e6; --on-accent: #ffffff; --strong: #1f4fc2; --pos: #18895a; --neg: #c63a3a; --warn: #8f6208;
  --code: #eef1fa; --critic: #fbf6e8; --critic-line: #e2cf9a; --scrim: #0b10207a; --toast: #1d2a52; --on-toast: #ffffff;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 14px; --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a1020; --panel: #111a30; --panel2: #18233f; --line: #25335a; --text: #e6ebf7; --dim: #8e9bbd;
  --accent: #3d7bff; --on-accent: #ffffff; --strong: #8db8ff; --pos: #35c48a; --neg: #ef6a6a; --warn: #e8b454;
  --code: #0b1226; --critic: #1b1a17; --critic-line: #5a4a25; --scrim: #000000a8; --toast: #26355e; --on-toast: #ffffff;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a1020; --panel: #111a30; --panel2: #18233f; --line: #25335a; --text: #e6ebf7; --dim: #8e9bbd;
  --accent: #3d7bff; --on-accent: #ffffff; --strong: #8db8ff; --pos: #35c48a; --neg: #ef6a6a; --warn: #e8b454;
  --code: #0b1226; --critic: #1b1a17; --critic-line: #5a4a25; --scrim: #000000a8; --toast: #26355e; --on-toast: #ffffff;
  color-scheme: dark }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--body); display: flex; flex-direction: column; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.bar { display: flex; align-items: center; gap: 4px; padding-block: 6px; padding-left: calc(var(--gl) - 8px); padding-right: calc(var(--gr) - 8px); background: var(--panel); border-bottom: 1px solid var(--line); }
.bar h1 { flex: 1; margin: 0 4px; font: 700 16px var(--display); letter-spacing: .12em; display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar h1 span { color: var(--dim); font: 400 12px var(--body); letter-spacing: 0; }
.gem { color: var(--accent); flex: none; }
.icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--dim); flex: none; }
.icon:active { background: var(--panel2); color: var(--text); }

#thread { flex: 1; min-height: 0; overflow-y: auto; padding-block: 14px 20px; padding-left: var(--gl); padding-right: var(--gr); overscroll-behavior: contain; }
.msg { max-width: 760px; margin: 0 auto 14px; min-width: 0; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .bubble { background: var(--accent); color: var(--on-accent); border-radius: var(--r) var(--r) 4px var(--r); padding: 9px 13px; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user img { max-width: 60%; max-height: 220px; border-radius: 12px; margin-bottom: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; margin-top: 4px; }
.tags span { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; }
.msg.assistant .bubble, .msg.critic .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 4px var(--r) var(--r) var(--r); padding: 4px 14px 10px; overflow-wrap: anywhere; }
.msg.critic .bubble { border-color: var(--critic-line); background: var(--critic); }
.msg.critic .who { color: var(--warn); }
.who { font-size: 11.5px; color: var(--dim); letter-spacing: .06em; margin: 0 4px 3px; }
.msg.x .bubble { opacity: .65; }
.note { font-size: 12px; color: var(--warn); margin: 4px 4px 0; }
.md h1, .md h2, .md h3 { font: 700 17px var(--display); margin: 12px 0 6px; text-wrap: balance; }
.md h4 { font: 600 14px var(--body); margin: 14px 0 4px; }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md strong { color: var(--strong); font-weight: 600; }
.md code { font: 13px/1.45 var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 5px; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.code { margin: 6px 0 10px; border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 10px; background: var(--code); }
.code.pos { border-left-color: var(--pos); } .code.neg { border-left-color: var(--neg); }
.code pre { margin: 0; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.code pre code { background: none; padding: 0; }
.code .copy { display: block; width: 100%; text-align: right; padding: 7px 12px; font-size: 12px; color: var(--strong); border-top: 1px solid var(--line); min-height: 36px; }
.code .copy:active { background: var(--panel2); }
.actions { display: flex; gap: 6px; margin: 6px 0 0; flex-wrap: wrap; }
.actions button { font-size: 12.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; min-height: 34px; }
.actions button:active { background: var(--panel2); color: var(--text); }
.dots { display: inline-flex; align-items: center; gap: 4px; padding: 12px 0 6px; color: var(--dim); font-size: 13px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; margin-right: 6px; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; } #drawer { transition: none !important; } }

.empty { max-width: 520px; margin: 5vh auto 0; text-align: center; color: var(--dim); }
.empty .gem { width: 50px; height: 50px; stroke-width: 1.2; }
.empty h2 { color: var(--text); font: 700 20px var(--display); margin: 10px 0 6px; }
.empty p { margin: 0; }
.empty .ex { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.empty .ex button { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; color: var(--text); }
.empty .ex button small { display: block; color: var(--dim); }
.empty .warnbox { margin-top: 16px; color: var(--warn); border: 1px solid var(--critic-line); background: var(--critic); border-radius: 12px; padding: 10px 14px; text-align: left; }

#composer { background: var(--panel); border-top: 1px solid var(--line); padding-block: 8px; padding-left: var(--gl); padding-right: var(--gr); }
#composer > * { max-width: 760px; margin-left: auto; margin-right: auto; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 13px; font-size: 13px; color: var(--dim); min-height: 34px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.alt { border-style: dashed; margin-left: 6px; }
.chip.alt[aria-pressed="true"] { background: none; border-style: solid; border-color: var(--pos); color: var(--pos); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; padding-bottom: 8px; }
.opts label { display: flex; flex-direction: column; font-size: 11px; color: var(--dim); flex: 1 1 84px; min-width: 0; }
.opts label:first-child { flex: 2 1 130px; }
.opts select { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; font-size: 13px; min-height: 34px; width: 100%; }
#attach { position: relative; width: fit-content; margin-bottom: 8px; margin-left: max(0px, calc((100% - 760px) / 2)); }
#attach img { height: 72px; border-radius: 10px; display: block; }
#attach .icon { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; background: var(--panel2); border: 1px solid var(--line); border-radius: 50%; color: var(--text); }
#attach .icon svg { width: 14px; height: 14px; }
.inputrow { display: flex; align-items: flex-end; gap: 6px; }
#input { flex: 1; min-width: 0; resize: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; max-height: 160px; outline: none; font-size: 16px; line-height: 1.35; }
#input:focus { border-color: var(--accent); }
.send { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.send .i-stop { display: none; fill: currentColor; stroke: none; }
body.busy .send .i-stop { display: block; } body.busy .send .i-send { display: none; }

#scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 5; }
#drawer { position: fixed; inset: 0 auto 0 0; width: min(84vw, 330px); background: var(--panel); border-right: 1px solid var(--line); z-index: 6; transform: translateX(-102%); transition: transform .2s; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 10px calc(env(safe-area-inset-bottom, 0px) + 14px) max(10px, env(safe-area-inset-left, 0px)); }
#drawer.open { transform: none; }
#drawer h2 { margin: 0 6px 10px; font: 700 15px var(--display); }
#chats { list-style: none; margin: 0; padding: 0; }
#chats li { display: flex; align-items: center; border-radius: 10px; }
#chats li.cur { background: var(--panel2); }
#chats .open { flex: 1; min-width: 0; text-align: left; padding: 11px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#chats .open small { display: block; color: var(--dim); font-size: 11px; }
#chats .none { color: var(--dim); padding: 10px 8px; }
#chats .sure { color: var(--neg); font-size: 12px; width: auto; padding: 0 10px; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 18px; width: min(94vw, 460px); max-height: 86%; padding: 18px; }
dialog::backdrop { background: var(--scrim); }
dialog h2 { margin: 0 0 12px; font: 700 17px var(--display); }
dialog label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 12px; }
dialog input, dialog select { display: block; width: 100%; margin-top: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; color: var(--text); }
dialog small { display: block; margin-top: 4px; font-size: 11.5px; }
dialog fieldset { border: 1px solid var(--line); border-radius: 12px; margin: 0 0 14px; padding: 10px 12px 0; }
dialog legend { font-size: 12px; color: var(--dim); padding: 0 6px; }
.row { display: flex; justify-content: space-between; gap: 10px; }
.row button { border-radius: 10px; padding: 10px 16px; min-height: 42px; }
.primary { background: var(--accent); color: var(--on-accent); }
.danger { color: var(--neg); border: 1px solid var(--neg); }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); transform: translateX(-50%); background: var(--toast); color: var(--on-toast); padding: 9px 16px; border-radius: 99px; font-size: 13px; z-index: 20; max-width: 90%; text-align: center; }

/* Pointer devices: hover feedback */
@media (hover: hover) {
  .icon:hover { background: var(--panel2); color: var(--text); }
  .chip:hover:not([aria-pressed="true"]), .actions button:hover, .empty .ex button:hover { border-color: var(--accent); color: var(--text); }
  .code .copy:hover, #chats .open:hover { background: var(--panel2); }
  #chats .open { border-radius: 10px; }
  .send:hover { filter: brightness(1.12); }
}
/* Desktop: history becomes a permanent sidebar, the conversation column widens */
@media (min-width: 900px) {
  body { display: grid; grid-template-columns: 290px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  #drawer { position: static; transform: none; width: auto; grid-column: 1; grid-row: 1 / -1; z-index: auto; transition: none; padding: 16px 10px; }
  .bar, #thread, #composer { grid-column: 2; }
  #menuBtn, #scrim { display: none !important; }
  .msg, #composer > * { max-width: 860px; }
  #attach { margin-left: max(0px, calc((100% - 860px) / 2)) !important; }
  .opts label, .opts label:first-child { flex: 0 1 180px; }
  .chips { flex-wrap: wrap; overflow: visible; }
  #thread { padding-block: 22px 28px; scrollbar-width: thin; }
  .msg.user .bubble { max-width: 75%; }
  #toast { left: calc(50% + 145px); }
}
</style>

  <button id="newBtn" class="icon" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="setBtn" class="icon" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>

<script>
const TARGETS = [
  { id: 'tsubaki3', label: 'Tsubaki.3 (PixAI)', build: 'TSUBAKI' }, { id: 'flux', label: 'Flux', build: 'TSUBAKI' },
  { id: 'qwen-image', label: 'Qwen-Image', build: 'TSUBAKI' }, { id: 'gpt-image', label: 'GPT-image', build: 'TSUBAKI' },
  { id: 'midjourney', label: 'Midjourney', build: 'TSUBAKI' }, { id: 'illustrious', label: 'Illustrious', build: 'TAG' },
  { id: 'noobai', label: 'NoobAI', build: 'TAG' }, { id: 'pony', label: 'Pony V6', build: 'TAG' },
  { id: 'anima', label: 'Anima', build: 'ANIMA' }, { id: 'anima_aesthetic', label: 'Anima Aesthetic', build: 'ANIMA' },
];
const MODES = [
  { id: 'auto', label: 'auto', hint: 'Type an idea, a prompt or a problem…' },
  { id: 'üret', label: 'generate', hint: 'Your idea → a finished prompt' },
  { id: 'varyant', label: 'variants', hint: 'Your idea → different readings' },
  { id: 'denetle', label: 'audit', hint: 'Paste the prompt to audit' },
  { id: 'onar', label: 'repair', hint: 'The prompt + what came out broken' },
  { id: 'görsel', label: 'image', hint: 'Attach an image, add a note if you like' },
  { id: 'tartış', label: 'discuss', hint: 'Let\'s discuss the idea…' },
];
const EXAMPLES = [
  { mode: 'üret', text: 'An old repairman fixing a carousel alone in a closed amusement park' },
  { mode: 'varyant', text: 'A witch who missed the last train' },
  { mode: 'tartış', text: 'An underwater library — where does the idea break?' },
];
const ERRORS = {
  not_granted: 'Claude access was not allowed. Reopen the page and allow it to continue.',
  sampling_disabled: 'Claude is not available on this account.', capability_disabled: 'Claude is not available in this view.',
  not_declared: 'Claude is not available in this view.', capability_removed: 'Claude is not available in this view.',
  rate_limited: 'Usage limit reached. Wait a while and try again.', session_expired: 'Your session expired; sign in again.',
  image_rejected: 'The image was not accepted; try another file.', images_unavailable: 'Images cannot be sent in this view.',
  refused: 'Claude declined this request. Change it and try again.', empty_completion: 'The reply came back empty; simplify the request and try again.',
  prompt_too_large: 'The chat is too long; start a new one.', upstream_error: 'Connection problem; try again.',
};

// ---------- storage (per-device convenience; the page works without it) ----------
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const settings = Object.assign({ tier: 'default', house: {} }, store.get('sapphire.settings', {}));
const prefs = Object.assign({ mode: 'auto', target: 'tsubaki3', rating: 'general', aspect: '', variants: '3', compact: false }, store.get('sapphire.prefs', {}));
let dbp;
function db() {
  dbp ??= new Promise((res, rej) => {
    try {
      const r = indexedDB.open('sapphire', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('chats', { keyPath: 'id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
async function idb(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('chats', mode); const rq = fn(t.objectStore('chats'));
    t.oncomplete = () => res(rq?.result); t.onerror = t.onabort = () => rej(t.error);
  });
}
const saveChat = () => { if (!chat.items.length) return; chat.updated = Date.now(); return idb('readwrite', (s) => s.put(chat)).then(renderChats, () => {}); };

// ---------- state ----------
const $ = (id) => document.getElementById(id);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
const newChat = () => ({ id: uid(), title: '', updated: Date.now(), items: [] });
let chat = newChat();
let pendingImage = null; // { blob, thumb }
let ctl = null;          // AbortController of the running call
let claudeOff = false;
const samplePromise = window.claude?.use ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500); }
function copyText(text, codeEl) {
  const fallback = () => {
    if (codeEl) { const r = document.createRange(); r.selectNodeContents(codeEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Text selected — copy it'); }
    else toast('Could not copy');
  };
  try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch { fallback(); }
}

function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
}
function md(src) {
  const out = []; let list = null, para = [], lastHead = '';
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const lines = src.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i]; let m;
    if (/^\s*```/.test(line)) {
      flushPara(); flushList(); const code = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);
      const cls = /pozitif|positive/i.test(lastHead) ? ' pos' : /negatif|negative/i.test(lastHead) ? ' neg' : '';
      out.push(`<div class="code${cls}"><pre><code>${esc(code.join('\n'))}</code></pre><button class="copy" data-copy>Copy</button></div>`);
    } else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      flushPara(); flushList(); lastHead = m[2]; out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
    } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); flushList(); out.push('<hr>'); }
    else if ((m = line.match(/^\s*(?:[-*•]|(\d+)[.)])\s+(.*)$/))) {
      flushPara(); const kind = m[1] ? 'ol' : 'ul';
      if (list !== kind) { flushList(); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline(m[2])}</li>`);
    } else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); if (/^\*\*[^*]+:\*\*/.test(line)) lastHead = line; para.push(line); }
  }
  flushPara(); flushList(); return out.join('');
}

// ---------- prompt assembly ----------
const targetInfo = (id) => TARGETS.find((t) => t.id === id) ?? TARGETS[0];
const promptText = (name) => $('p-' + name).textContent.trim();
function rulesFor(target) {
  let text = 'Operate as the system defined below for every message in this conversation. Its rules are standing instructions, not content to discuss.\n\n' + promptText(targetInfo(target).build);
  const hs = Object.entries(settings.house ?? {}).filter(([, v]) => v?.trim());
  if (hs.length) text += `\n<house_style>\n${hs.map(([k, v]) => `${k}: ${v.trim()}`).join('\n')}\n</house_style>\n`;
  return text;
}
function compose(text, meta, hasImage) {
  const head = [];
  if (meta.mode !== 'auto') head.push(`mode: ${MODES.find((m) => m.id === meta.mode)?.label ?? meta.mode}`);
  head.push(`model: ${meta.target}`, `rating: ${meta.rating}`);
  if (meta.aspect) head.push(`aspect: ${meta.aspect}`);
  if (meta.mode === 'varyant') head.push(`variants: ${meta.variants}`);
  if (meta.compact) head.push('detail: compact');
  if (hasImage) head.push('image: attached to this message');
  return `${head.join('\n')}\n\n${text}`.trim();
}
// Claude keeps nothing between calls: resend the rules plus the completed turns, oldest dropped first.
function turnsFor(target) {
  const turns = [];
  for (const it of chat.items) {
    if (it.x) continue;
    if (it.kind === 'user') turns.push({ role: 'user', content: it.composed });
    else if (it.kind === 'assistant' && it.done) turns.push({ role: 'assistant', content: it.text });
  }
  const size = (s) => new TextEncoder().encode(s).length;
  const rules = rulesFor(target);
  let total = size(rules) + turns.reduce((n, t) => n + size(t.content), 0);
  while (total > 200000 && turns.length > 2) { total -= size(turns.shift().content) + size(turns.shift().content); }
  return [{ role: 'user', content: rules }, ...turns];
}
async function ask(input, onText, images) {
  const sample = await samplePromise;
  if (!sample) { claudeOff = true; throw { code: 'capability_disabled' }; }
  ctl = new AbortController();
  const opts = { cache: false, signal: ctl.signal, modelTier: settings.tier, onText: ({ text }) => onText(text) };
  if (images) opts.images = images;
  try { return await sample(input, opts); } finally { ctl = null; }
}

// ---------- rendering ----------
const thread = $('thread');
const GEM = '<svg class="gem" viewBox="0 0 24 24"><path d="M7 3h10l5 6-10 12L2 9z"/><path d="M2 9h20M7 3l5 6 5-6M12 9v12"/></svg>';
function bubbleHTML(it) {
  if (it.kind === 'user') {
    const m = it.meta;
    const tags = [m.mode !== 'auto' && MODES.find((x) => x.id === m.mode)?.label, targetInfo(m.target).label, m.rating !== 'general' && m.rating, m.aspect, m.compact && 'compact']
      .filter(Boolean).map((t) => `<span>${esc(t)}</span>`).join('');
    return (it.thumb ? `<img alt="Attached image" src="${it.thumb}">` : '') + (it.text ? `<div class="bubble">${esc(it.text)}</div>` : '') + `<div class="tags">${tags}</div>`;
  }
  const body = it.text ? md(it.text) : '<span class="dots"><i></i><i></i><i></i>Thinking…</span>';
  let actions = '';
  if (!it.pending && it.text) actions = `<div class="actions"><button data-act="copy">Copy all</button>${it.kind === 'assistant' && it.done ? '<button data-act="critic">Critic pass</button>' : ''}</div>`;
  return `<div class="who">${it.kind === 'critic' ? 'Critic' : 'RUVET.'}</div><div class="bubble md">${body}</div>${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}${actions}`;
}
function render() {
  if (!chat.items.length) {
    thread.innerHTML = `<div class="empty">${GEM}<h2>Hi, I\'m RUVET.</h2>
      <p>Give me an idea, an image or a prompt and pick your target model.</p>
      <div class="ex">${EXAMPLES.map((e, i) => `<button data-ex="${i}">${esc(e.text)}<small>${MODES.find((m) => m.id === e.mode).label}</small></button>`).join('')}</div>
      ${claudeOff ? '<div class="warnbox">Claude cannot be reached in this view. Open the page while signed in to claude.ai.</div>' : ''}</div>`;
    return;
  }
  thread.innerHTML = chat.items.map((it, i) => `<div class="msg ${it.kind}${it.x && it.kind !== 'critic' ? ' x' : ''}" data-i="${i}">${bubbleHTML(it)}</div>`).join('');
  thread.scrollTop = thread.scrollHeight;
}
let raf = 0;
function renderItem(it) {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    const el = thread.querySelector(`[data-i="${chat.items.indexOf(it)}"]`); if (!el) return;
    const stick = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 120;
    el.innerHTML = bubbleHTML(it);
    if (stick) thread.scrollTop = thread.scrollHeight;
  });
}
function setBusy(b) { document.body.classList.toggle('busy', b); $('sendBtn').setAttribute('aria-label', b ? 'Stop' : 'Send'); }

// ---------- actions ----------
let running = false;
async function send() {
  if (running) { ctl?.abort(); return; }
  const input = $('input'); const text = input.value.trim();
  if (!text && !pendingImage) return;
  const meta = { ...prefs }; const img = pendingImage;
  const user = { kind: 'user', text, meta, thumb: img?.thumb, composed: compose(text, meta, !!img) };
  const asst = { kind: 'assistant', text: '', target: meta.target, pending: true };
  chat.items.push(user, asst);
  chat.title ||= (text || 'Image').slice(0, 60);
  input.value = ''; autosize(); setImage(null);
  running = true; render(); setBusy(true);
  try {
    const res = await ask(turnsFor(meta.target), (t) => { asst.text = t; renderItem(asst); }, img?.blob);
    asst.text = res.text; asst.done = true;
    if (res.truncated) asst.note = 'The reply was cut short; you can type "continue".';
  } catch (e) {
    if (e?.code === 'cancelled' && e.text) {
      asst.text = e.text; user.x = asst.x = true; asst.note = 'Stopped — this turn is left out of later requests.';
    } else {
      // Nothing usable came back: roll the turn back and return the text to the composer.
      chat.items.splice(chat.items.indexOf(user), 2);
      input.value = text; autosize(); setImage(img);
      if (e?.code !== 'cancelled') toast(ERRORS[e?.code] ?? ERRORS.upstream_error);
    }
  }
  asst.pending = false; running = false; setBusy(false); render(); saveChat();
}
async function runCritic(src) {
  if (running) return;
  const item = { kind: 'critic', text: '', pending: true, x: true };
  chat.items.splice(chat.items.indexOf(src) + 1, 0, item);
  running = true; render(); setBusy(true);
  try {
    const res = await ask([
      { role: 'user', content: 'Operate as the auditor defined below.\n\n' + promptText('CRITIC') },
      { role: 'user', content: `Target model: ${src.target}\n\nSAPPHIRE output to audit:\n\n${src.text}` },
    ], (t) => { item.text = t; renderItem(item); });
    item.text = res.text;
  } catch (e) {
    if (e?.text) item.text = e.text; else chat.items.splice(chat.items.indexOf(item), 1);
    if (e?.code !== 'cancelled') toast(ERRORS[e?.code] ?? ERRORS.upstream_error);
  }
  item.pending = false; running = false; setBusy(false);
  const top = thread.scrollTop; render(); thread.scrollTop = top; saveChat();
}

function scaled(bmp, max, q) {
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  return { canvas: c, url: c.toDataURL('image/jpeg', q) };
}
async function readImage(file) {
  const bmp = await createImageBitmap(file);
  const big = scaled(bmp, 1568, 0.9);
  const blob = await new Promise((res) => big.canvas.toBlob(res, 'image/jpeg', 0.9));
  return { blob, thumb: scaled(bmp, 480, 0.8).url };
}
function setImage(img) { pendingImage = img; $('attach').hidden = !img; if (img) $('attach').querySelector('img').src = img.thumb; }
function autosize() { const t = $('input'); t.style.height = 'auto'; t.style.height = `${Math.min(t.scrollHeight + 2, 160)}px`; }
function syncControls() {
  $('modes').innerHTML = MODES.map((m) => `<button class="chip" data-mode="${m.id}" aria-pressed="${m.id === prefs.mode}">${m.label}</button>`).join('')
    + `<button class="chip alt" data-compact aria-pressed="${prefs.compact}">compact output</button>`;
  $('input').placeholder = MODES.find((m) => m.id === prefs.mode)?.hint ?? '';
  $('variantsWrap').hidden = prefs.mode !== 'varyant';
  for (const k of ['target', 'rating', 'aspect', 'variants']) $(k).value = prefs[k];
  store.set('sapphire.prefs', prefs);
}

// ---------- drawer & settings ----------
let sureId = null;
async function renderChats() {
  const all = (await idb('readonly', (s) => s.getAll()).catch(() => [])).sort((a, b) => b.updated - a.updated);
  $('chats').innerHTML = all.length ? all.map((c) =>
    `<li class="${c.id === chat.id ? 'cur' : ''}"><button class="open" data-id="${c.id}">${esc(c.title || 'Untitled')}<small>${new Date(c.updated).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' })}</small></button>`
    + (sureId === c.id ? `<button class="icon sure" data-del="${c.id}">Delete?</button>`
      : `<button class="icon" data-ask="${c.id}" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>`) + '</li>').join('')
    : '<li class="none">No saved chats yet.</li>';
}
async function openDrawer() { await renderChats(); $('drawer').classList.add('open'); $('scrim').hidden = false; }
function closeDrawer() { sureId = null; $('drawer').classList.remove('open'); $('scrim').hidden = true; }
const HS = { palette: 'hsPalette', motifs: 'hsMotifs', banned: 'hsBanned', signature: 'hsSignature' };
function openSettings() {
  $('tier').value = settings.tier; wipeArmed = false; $('wipeBtn').textContent = 'Delete all chats';
  for (const k in HS) $(HS[k]).value = settings.house?.[k] ?? '';
  $('settings').showModal();
}

// ---------- events ----------
$('target').innerHTML = TARGETS.map((t) => `<option value="${t.id}">${t.label}</option>`).join('');
$('modes').addEventListener('click', (e) => {
  const x = $('modes').scrollLeft; const m = e.target.closest('[data-mode]');
  if (m) prefs.mode = m.dataset.mode; else if (e.target.closest('[data-compact]')) prefs.compact = !prefs.compact; else return;
  syncControls(); $('modes').scrollLeft = x;
});
for (const k of ['target', 'rating', 'aspect', 'variants']) $(k).addEventListener('change', (e) => { prefs[k] = e.target.value; syncControls(); });
$('input').addEventListener('input', autosize);
// Desktop: Enter sends, Shift+Enter makes a new line. Touch: Enter makes a new line, the button sends.
const desktop = matchMedia('(hover: hover) and (pointer: fine)');
$('input').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.ctrlKey || e.metaKey || (desktop.matches && !e.shiftKey)) { e.preventDefault(); send(); }
});
$('input').addEventListener('paste', async (e) => {
  const f = [...(e.clipboardData?.files ?? [])].find((x) => x.type.startsWith('image/'));
  if (!f || $('imgBtn').hidden) return;
  e.preventDefault();
  try { setImage(await readImage(f)); } catch { toast('Could not read the image'); }
});
$('sendBtn').addEventListener('click', send);
$('imgBtn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { setImage(await readImage(f)); } catch { toast('Could not read the image'); }
});
$('attachDel').addEventListener('click', () => setImage(null));
thread.addEventListener('click', (e) => {
  const copy = e.target.closest('[data-copy]');
  if (copy) { const c = copy.parentElement.querySelector('code'); return copyText(c.textContent, c); }
  const ex = e.target.closest('[data-ex]');
  if (ex) { const x = EXAMPLES[ex.dataset.ex]; prefs.mode = x.mode; syncControls(); $('input').value = x.text; autosize(); $('input').focus(); return; }
  const act = e.target.closest('[data-act]'); if (!act) return;
  const it = chat.items[act.closest('.msg').dataset.i];
  if (act.dataset.act === 'copy') copyText(it.text);
  if (act.dataset.act === 'critic') runCritic(it);
});
$('menuBtn').addEventListener('click', openDrawer);
$('scrim').addEventListener('click', closeDrawer);
$('newBtn').addEventListener('click', () => { if (running) return toast('Stop the reply first'); chat = newChat(); render(); renderChats(); });
$('chats').addEventListener('click', async (e) => {
  const askDel = e.target.closest('[data-ask]');
  if (askDel) { sureId = askDel.dataset.ask; return renderChats(); }
  const del = e.target.closest('[data-del]');
  if (del) {
    await idb('readwrite', (s) => s.delete(del.dataset.del)).catch(() => {});
    if (del.dataset.del === chat.id && !running) { chat = newChat(); render(); }
    sureId = null; return renderChats();
  }
  const open = e.target.closest('[data-id]'); if (!open) return;
  if (running) return toast('Stop the reply first');
  const c = await idb('readonly', (s) => s.get(open.dataset.id)).catch(() => null);
  if (c) { chat = c; render(); }
  closeDrawer(); renderChats();
});
$('setBtn').addEventListener('click', openSettings);
$('setForm').addEventListener('submit', (e) => {
  e.preventDefault();
  settings.tier = $('tier').value; settings.house = {};
  for (const k in HS) settings.house[k] = $(HS[k]).value;
  store.set('sapphire.settings', settings); $('settings').close(); toast('Saved');
});
$('settings').addEventListener('click', (e) => { if (e.target === $('settings')) $('settings').close(); });
let wipeArmed = false;
$('wipeBtn').addEventListener('click', async () => {
  if (!wipeArmed) { wipeArmed = true; $('wipeBtn').textContent = 'Are you sure? Tap again'; return; }
  await idb('readwrite', (s) => s.clear()).catch(() => {});
  if (!running) { chat = newChat(); render(); }
  $('settings').close(); toast('Chats deleted');
});

syncControls(); render(); renderChats();
if (desktop.matches) $('input').focus();
samplePromise.then(async (sample) => {
  if (!sample) { claudeOff = true; if (!chat.items.length) render(); return; }
  const caps = await sample.limits().catch(() => null);
  $('imgBtn').hidden = !caps?.images;
});
</script>
